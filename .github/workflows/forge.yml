name: Forge

on:
  pull_request:
    paths:
      - 'installer/**'
      - 'console/**'
      - 'packages/console-core/**'
      - 'packages/console-components/**'
      - '.github/workflows/forge.yml'

permissions:
  contents: read

concurrency:
  group: forge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix console ci --ignore-scripts
      - run: npm --prefix installer/web ci
      - run: npm --prefix installer/web run build
      - name: Frontend regression tests
        working-directory: installer/web
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: node --test --test-concurrency=2 *.test.mjs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e './installer[test]'
      - run: npm --prefix installer/web ci
      - run: npm --prefix installer/web run build
      - name: Backend regression tests
        run: python -m pytest -q installer/tests --tb=short --junitxml=forge-pytest.xml
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-pytest
          path: forge-pytest.xml
          if-no-files-found: ignore
