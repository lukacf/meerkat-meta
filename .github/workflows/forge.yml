name: Forge

on:
  pull_request:
    paths:
      - 'installer/**'
      - 'console/**'
      - 'packages/console-core/**'
      - 'packages/console-components/**'
      - 'sdk/python/**'
      - 'README.md'
      - 'LICENSE-MIT'
      - 'LICENSE-APACHE'
      - '.github/workflows/forge.yml'

permissions:
  contents: read

concurrency:
  group: forge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix console ci --ignore-scripts
      - run: npm --prefix installer/web ci
      - run: npm --prefix installer/web run build
      - name: Frontend regression tests
        working-directory: installer/web
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: node --test --test-concurrency=2 *.test.mjs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the reviewed Guide client SDK
        run: python -m pip install --no-index --no-deps --require-hashes --find-links installer/vendor/guide -r installer/requirements-guide-sdk.txt
      - run: python -m pip install -e './installer[test]'
      - name: Prepare Linux acceptance isolation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap libseccomp2 apparmor apparmor-profiles
          forge_bwrap_profile=
          for candidate in /etc/apparmor.d/bwrap /etc/apparmor.d/bwrap-userns-restrict /usr/share/apparmor/extra-profiles/bwrap-userns-restrict; do
            if test -f "$candidate"; then
              forge_bwrap_profile=$candidate
              break
            fi
          done
          test -n "$forge_bwrap_profile"
          printf 'Loading packaged bubblewrap policy: %s\n' "$forge_bwrap_profile"
          sudo apparmor_parser -r "$forge_bwrap_profile"
      - name: Verify Linux acceptance isolation
        env:
          PYTHONPATH: installer
        run: |
          bwrap --version
          bwrap --unshare-user --unshare-pid --unshare-net --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 -- /usr/bin/true
          python - <<'PY'
          import pathlib
          import sysconfig
          from launchkit.implementation_workspace import _sandbox_executable
          library = pathlib.Path(sysconfig.get_config_var("LIBDIR")) / sysconfig.get_config_var("LDLIBRARY")
          print("Selected Python shared library:", library, "->", library.resolve(), flush=True)
          if not _sandbox_executable():
              raise SystemExit("Linux acceptance isolation is unavailable; no generated-code checks can run.")
          print("Linux acceptance isolation probe passed.")
          PY
      - name: Prepare private DOM dependencies
        run: |
          umask 077
          npm --prefix console ci --ignore-scripts
      - run: npm --prefix installer/web ci
      - run: npm --prefix installer/web run build
      - name: Prepare protected DOM checks
        env:
          PYTHONPATH: installer
        run: |
          python -m launchkit.checker_runtime
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from launchkit.dom_check import prepare_dependencies
          with TemporaryDirectory() as folder:
              prepare_dependencies(Path(folder).resolve())
          print("Authenticated DOM dependency closure is ready.")
          PY
      - name: Backend regression tests
        run: python -m pytest -vv installer/tests --maxfail=10 --tb=short --junitxml=forge-pytest.xml
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-pytest
          path: forge-pytest.xml
          if-no-files-found: ignore
