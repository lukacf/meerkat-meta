name: CI

on:
  push:
    branches: [main, "ci/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Swatinem/rust-cache restores and saves <workspace>/target, while
  # scripts/repo-cargo defaults to a per-worktree target under ~/.cache, so no
  # job cached a compiled artifact: test-voice in run 38020666512 restored
  # 538 MB, none of it build output, then spent 15m09 in clippy and 25m43
  # building tests. repo-cargo keeps an explicit CARGO_TARGET_DIR, so CI names
  # the directory rust-cache covers. CONTRIBUTING.md keeps local custom roots
  # outside the checkout; a disposable CI checkout has no such need. Local
  # runs set nothing and keep their per-worktree targets.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  # With build output cached, a rust-cache entry is the registry plus one
  # dependency graph's artifacts: about 1 GB compressed (a local Meta debug
  # target's dependency share, 4.6 GiB, packs to 0.95 GB with zstd). Nine
  # per-job entries, plus a copy for every pull request ref, would overrun
  # the repository's 20 GB cache and evict main's entries. So only main
  # saves, and jobs that build the same dependency graph share one entry:
  # meta-dev-examples (examples and tests, with dev-dependency features)
  # and meta-dev-bins (binaries only).
  #
  # Both groups build with line tables only, like test-voice and
  # test-extension-state: full debuginfo made them the two largest entries
  # (1.37 GB each against 0.92-1.08 GB for the other test builds), and no
  # job runs a debugger. Panic locations and backtraces keep file:line.
  #
  # On main, a job whose restore found no exact key saves a new generation
  # when it ends. Once every such job has succeeded, the
  # drop-superseded-caches job deletes each family's older main entries
  # (scripts/ci-drop-superseded-caches.sh), so CI keeps one generation per
  # family and its saves stop evicting other entries, release.yml's among
  # them. That job alone holds actions: write, and it runs only for pushes
  # to main, never for a pull request.
  #
  # No job caps CARGO_BUILD_JOBS. test-voice, voice-clippy,
  # test-extension-state and extension-state-lint carried a cap of 2 copied
  # from release.yml's release-profile memory limit, while every other job
  # builds the same crates in the dev profile at the runner's 4. The cap
  # throttled the dependency graph: capped, test-voice spent 19m06 on Meerkat
  # Core alone (run 38714502600); uncapped and with no cache at all, it
  # compiled all 472 crates, third-party ones included, in 19m42 (run
  # 38729784563). meerkat-meta itself did not get faster (14m22 capped,
  # 13m36 uncapped): its test harness is one rustc process.

jobs:
  # Decides which lanes of Rust, console, SDK and example jobs this run
  # needs. A pull request runs the lanes its changed files can reach: none
  # for docs or the non-CI workflows, only the console lanes for console/,
  # every lane but console-perf for Rust sources (scripts/ci-changes.py maps
  # the paths). Pushes and dispatches always run every lane, so main keeps
  # the full green run release.yml requires.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      integration: ${{ steps.classify.outputs.integration }}
      python: ${{ steps.classify.outputs.python }}
      console: ${{ steps.classify.outputs.console }}
      console_perf: ${{ steps.classify.outputs.console_perf }}
      flow_editor: ${{ steps.classify.outputs.flow_editor }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request checks out GitHub's merge commit; its first
          # parent is the base, so the diff is the pull request's own change.
          fetch-depth: 2
      - id: classify
        # The base commit's classifier decides, so a pull request never
        # classifies itself with the classifier it changes. Fails closed:
        # if it errors, or prints no line for some lane (a base that
        # predates the lanes), every lane runs.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          lanes="rust integration python console console_perf flow_editor"
          result="${RUNNER_TEMP}/lanes"
          classified=false
          if git show HEAD^1:scripts/ci-changes.py > "${RUNNER_TEMP}/ci-changes.py" \
              && python3 "${RUNNER_TEMP}/ci-changes.py" --event "${EVENT}" --github-output "${result}"; then
            classified=true
            for lane in ${lanes}; do
              grep -Eqx "${lane}=(true|false)" "${result}" || classified=false
            done
          fi
          if [[ "${classified}" == true ]]; then
            grep -Ex "(${lanes// /|})=(true|false)" "${result}" >> "${GITHUB_OUTPUT}"
          else
            echo "the base classifier failed or has no lanes; running every lane"
            for lane in ${lanes}; do
              echo "${lane}=true" >> "${GITHUB_OUTPUT}"
            done
          fi

  fmt-lint:
    name: fmt-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/repo-cargo fmt --all -- --check
      - run: python3 scripts/check-conflict-markers
      - run: python3 scripts/test_check_conflict_markers.py
      - run: scripts/verify-version-parity.sh
      - run: python3 scripts/verify-runtime-options-reachable.py
      - run: python3 scripts/verify-decorator-authority.py
      - run: python3 scripts/verify-session-service-decorators.py
      - run: python3 scripts/test_verify_session_service_decorators.py
      - run: python3 scripts/test_ci_workflow.py
      - run: python3 scripts/test_ci_changes.py
      - run: python3 scripts/test_ci_drop_caches.py
      - run: python3 scripts/test_repo_cargo.py
      - run: python3 scripts/test_pre_push_clippy.py
      - run: python3 scripts/test_release_version_scripts.py
      - run: python3 scripts/test_release_workflow.py
      - run: python3 scripts/test_release_candidate.py
      - run: python3 scripts/test_verify_published_registries.py
      - run: python3 scripts/test_verify_release_assets.py
      - run: python3 scripts/verify-crate-publication.py
      - run: python3 scripts/test_verify_crate_publication.py
      - run: python3 scripts/verify-crate-package-files.py
      - run: python3 scripts/test_verify_crate_package_files.py
      - run: python3 scripts/test_memory_evals.py
      - run: scripts/check-memory-bright-line
      - run: scripts/memory-evals --check
      - run: node scripts/generate-bazel-rust-builds.mjs --check
      - uses: taiki-e/install-action@cargo-machete
      - run: scripts/repo-cargo clippy --workspace --all-targets -- -D warnings
      - run: scripts/repo-cargo machete --with-metadata

  # Unit tests run in one job and integration tests in two halves. As one
  # job, the build took 12.8-16.4 minutes and the run 5.1-6.2 (October
  # 2026). On 4 CPUs with warm dependencies, the unit tests and bins build
  # in 330 s. Each integration half needs the meerkat-meta library (about
  # 230 s); after it, all integration tests together take 231 s and the
  # examples 38 s. All three jobs build the same dependency graph, so
  # they share the test job's cache.
  test:
    name: test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    env:
      # ~88 debug test binaries each statically link the full meerkat stack.
      # With the 0.7.31 realtime deps, full debuginfo blew past the runner
      # disk even after the reclaim step, and line-tables-only bought room.
      # With the Meerkat 0.8.52 dependency graph even line tables no longer
      # fit: links died with ENOSPC (71 MB left of 119 GB free at job start).
      # CI test binaries therefore carry no debuginfo; panics keep their
      # messages but backtraces lose file:line. Local builds are unaffected.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      # The workspace debug build (meerkat 0.7.25 dep tree + all test
      # binaries) plus the rust-cache restore no longer fits beside the
      # runner's preinstalled toolchains - three consecutive runs died to
      # ENOSPC mid-link. Reclaim ~30GB of images we never use (mirrors
      # meerkat's release-lane reclaim, meerkat#858).
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/share/swift /usr/local/julia* /opt/microsoft \
            /usr/local/share/powershell /usr/share/miniconda \
            /usr/local/share/chromium /usr/local/share/vcpkg
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      # The idle CPU gate asserts an absolute per-30s CPU budget calibrated on
      # real hardware; GitHub's shared 2-vCPU runners read ~3-4s where real
      # machines read 0.5-2s, even with exclusive nextest scheduling - the
      # runner class is not a valid measurement environment for the assertion.
      # The gate stays armed in local full-suite runs (exclusively scheduled
      # via .config/nextest.toml) and in the release-gate protocol.
      # The live-event burst test remains CPU-speed-sensitive. History backfill
      # saturation uses a deterministic read barrier and runs in this gate.
      - run: scripts/repo-cargo nextest run --workspace --lib --bins -E 'not test(governance_contracts) and not test(converged_idle_gateway_consumes_near_zero_cpu) and not test(live_event_burst_reaches_store_while_slow_backfill_is_running)' --no-fail-fast

  test-integration:
    name: test-integration (${{ matrix.tests }})
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Integration test targets by first letter: [a-i] holds about 60% of
        # their build time and two thirds of their run time, so the other
        # half also builds the examples. scripts/test_ci_workflow.py checks
        # that every integration test target matches exactly one pattern.
        include:
          - tests: "[a-i]*"
          - tests: "[j-z]*"
            examples: true
    env:
      # ~88 debug test binaries each statically link the full meerkat stack.
      # With the 0.7.31 realtime deps, full debuginfo blew past the runner
      # disk even after the reclaim step, and line-tables-only bought room.
      # With the Meerkat 0.8.52 dependency graph even line tables no longer
      # fit: links died with ENOSPC (71 MB left of 119 GB free at job start).
      # CI test binaries therefore carry no debuginfo; panics keep their
      # messages but backtraces lose file:line. Local builds are unaffected.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # The in-process held-bootstrap and native-grant tests resolve a
      # provider identity while they build members but never call the
      # provider. This is the same fake value the gateway test fixtures give
      # their child processes, not a secret.
      OPENAI_API_KEY: sk-regression-test
    steps:
      # The workspace debug build (meerkat 0.7.25 dep tree + all test
      # binaries) plus the rust-cache restore no longer fits beside the
      # runner's preinstalled toolchains - three consecutive runs died to
      # ENOSPC mid-link. Reclaim ~30GB of images we never use (mirrors
      # meerkat's release-lane reclaim, meerkat#858).
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/share/swift /usr/local/julia* /opt/microsoft \
            /usr/local/share/powershell /usr/share/miniconda \
            /usr/local/share/chromium /usr/local/share/vcpkg
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      # The idle CPU gate asserts an absolute per-30s CPU budget calibrated on
      # real hardware; GitHub's shared 2-vCPU runners read ~3-4s where real
      # machines read 0.5-2s, even with exclusive nextest scheduling - the
      # runner class is not a valid measurement environment for the assertion.
      # The gate stays armed in local full-suite runs (exclusively scheduled
      # via .config/nextest.toml) and in the release-gate protocol.
      # The live-event burst test remains CPU-speed-sensitive. History backfill
      # saturation uses a deterministic read barrier and runs in this gate.
      - run: scripts/repo-cargo nextest run --workspace --test '${{ matrix.tests }}' -E 'not test(governance_contracts) and not test(converged_idle_gateway_consumes_near_zero_cpu) and not test(live_event_burst_reaches_store_while_slow_backfill_is_running)' --no-fail-fast
      # cargo's default test selection also builds every example, to prove
      # it compiles and links; one integration half does that here.
      - if: matrix.examples
        run: scripts/repo-cargo build --workspace --examples

  # The two meerkat-meta test targets are separate compilations of the
  # library: the integration test links it as a dependency, the --lib run
  # compiles it again with cfg(test). Run one after the other they built
  # serially (run 38714502600: 25m52 then 10m20) while rustc's front end
  # kept one of the 4 CPUs busy, so one `--no-run` invocation builds both
  # in parallel and the filtered runs below only execute them.
  test-extension-state:
    name: test-extension-state
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/repo-cargo test -p meta-extension-state --locked
      - run: scripts/repo-cargo test -p meerkat-meta --locked --features extension-state --lib --test extension_state --no-run
      - run: scripts/repo-cargo test -p meerkat-meta --locked --features extension-state --test extension_state
      - run: scripts/repo-cargo test -p meerkat-meta --locked --features extension-state --lib -- extension_ document_mcp_child_supply

  # test-extension-state's check and clippy, split out: both only emit
  # metadata, so they share little with the two full test builds, which
  # ran after them in one job (run 38506503806: check 12m22 and clippy
  # 14m10, then the tests 21m52 and 8m24).
  extension-state-lint:
    name: extension-state-lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/repo-cargo check -p meerkat-meta --locked --no-default-features
      - run: scripts/repo-cargo clippy -p meerkat-meta --locked --features extension-state --lib --test extension_state -- -D warnings

  test-voice:
    name: test-voice
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # The feature union triggers the repository's Rust 1.97 incremental ICE.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The shared host uses a loopback provider, never paid credentials.
      - run: scripts/repo-cargo test -p meerkat-meta --locked --features openai-live --lib --bin rpc_gateway --bin meta_gateway --test console_route_auth --test console_experience --test never_executed_persistence --test swarm_integration console_voice
      - run: scripts/repo-cargo test -p meerkat-meta --locked --features openai-live --lib gateway_openai_live_registration
      # Reuse this feature build for classic/identity restarts with and without voice.
      - run: scripts/repo-cargo test -p meerkat-meta --locked --features openai-live --test meta_gateway_bootstrap persistent_http_restarts

  # test-voice's strict lint, split out: clippy only emits metadata, so it
  # shares little with the full test build beyond host build scripts and
  # proc macros, and in one job the two ran back to back (run 38506503806:
  # clippy 19m03, then the test build 32m16).
  voice-clippy:
    name: voice-clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # The feature union triggers the repository's Rust 1.97 incremental ICE.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/repo-cargo clippy -p meerkat-meta --locked --features openai-live --lib --bin rpc_gateway --bin meta_gateway -- -D warnings

  test-python:
    name: test-python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: meta-dev-bins
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # release.yml's verify_crate_packages restores this entry; no
          # executable from ~/.cargo/bin rides along.
          cache-bin: false
      - run: python -m pip install 'sdk/python[dev]'
      # Gateway-backed structural tests materialize OpenAI profiles but never
      # issue provider requests. Meerkat resolves auth during construction, so
      # give those tests an explicit non-secret bootstrap credential instead of
      # depending on repository secrets or silently skipping the gateway lane.
      - run: make test-python
        env:
          OPENAI_API_KEY: meta-ci-bootstrap-only-not-a-secret

  # The console lane was one serial job whose two heaviest steps accounted for
  # 22.3 of its ~38 minutes, while all nine npm check scripts took 0.0m each.
  # Measured per-step on run 33165647168 (main 90fc6513, console 37m51s of a
  # 37m59s run - 99.6%):
  #
  #     12.0m  fixtures:console-customization     -> console-fixtures
  #     10.3m  incident topology acceptance       -> console-acceptance
  #      2.7m  e2e:browser                        }
  #      2.3m  memory_console_reference build     }  stay here
  #      2.1m  library_mode_reference build       }
  #      0.0m  the nine check scripts             }
  #
  # Splitting "fast checks from slow e2e" would have bought nothing, because the
  # checks are already free. These three run in parallel, so wall clock is the
  # longest job rather than the sum.
  #
  # Each job pays its own npm ci and rust-cache restore, so total runner minutes
  # rise while wall clock falls. That is the trade, not a free win.
  #
  # All three are named in `gate`. A job absent from `gate` is not a gate.
  #
  # Run 38506503806 (2026-10-14): besides its backend build, `console` still
  # spent 22m01 in non-Rust steps, 9m31 of them in perf:typing:browser and
  # 10m06 in the browser scenarios (browser-e2e 8m47, MCP Apps 1m19). Those
  # now run beside it in console-perf and console-browser, also in `gate`.
  console:
    name: console
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Rust 1.97 incremental compilation can ICE in async identity iteration.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: meta-dev-examples
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm --prefix console ci --silent --no-fund --no-audit
      - run: npm --prefix console run phase0:types --silent
      - run: npm --prefix console run contracts:console --silent
      - run: npm --prefix console run contracts:conversation --silent
      # Continuing a transcript derivation must equal deriving from scratch,
      # checked on every adapter suite's frame sequences.
      - run: npm --prefix console run contracts:timeline-incremental --silent
      - run: npm --prefix console run typecheck:contracts --silent
      - run: npm --prefix console run test:scenario-registry --silent
      - run: npm --prefix console run e2e:api:list --silent
      - run: npm --prefix console run e2e:browser:list --silent
      - run: npm --prefix console run phase1:targets --silent
      - run: npm --prefix console run headless:transport --silent
      - run: npm --prefix console run topology:adapter --silent
      - run: npm --prefix console run topology:components --silent
      - run: npm --prefix console run components:reuse --silent
      - run: npm --prefix console run embedded:freshness --silent
      - run: npm --prefix console run build:acceptance --silent
      - run: npm --prefix console exec -- playwright install --with-deps chromium
      # One immutable backend build serves every browser/API scenario below.
      - name: Build console acceptance backends
        run: |
          scripts/repo-cargo build -p meerkat-meta --example library_mode_reference --example console_acceptance_fixture --example memory_console_reference --example workgraph_console_reference
          target_dir="$(scripts/repo-cargo --print-env | sed -n 's/^CARGO_TARGET_DIR=//p')"
          echo "META_EXAMPLE_BIN_DIR=${target_dir}/debug/examples" >> "$GITHUB_ENV"
      - run: scripts/repo-cargo test -p meerkat-meta --example console_acceptance_fixture
      - run: node console/api-e2e.cjs
      - run: node console/voice-e2e.cjs
      # Validate paid-lane evidence and continuous silent audio without credentials.
      - run: node console/voice-e2e-live.cjs --self-test
      - run: node console/voice-e2e-live.cjs --self-test-audio
      - run: node console/memory-e2e.cjs
      - run: node console/workgraph-e2e.cjs
      - name: Upload console evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-${{ github.run_id }}
          path: output/playwright/console-acceptance/
          if-no-files-found: error

  # The browser scenarios against the real acceptance backends, split from
  # `console`. They need the same backend build, which the shared
  # meta-dev-examples cache serves, and freshly built console bundles: the
  # scenarios read console/dist and the backends embed
  # crates/meerkat-meta/console-dist, both written by `run build`.
  #
  # Two shards: browser-e2e's 100 scenarios took 9.5-10.1 minutes in one
  # leg (runs 38536518805, 38547674877, 38550484431), and the scenario
  # registry deals each to exactly one --shard=i/n leg
  # (console/scenario-registry.test.cjs). Each leg builds the backends;
  # MCP Apps run in leg 1.
  console-browser:
    name: console-browser
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Rust 1.97 incremental compilation can ICE in async identity iteration.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: meta-dev-examples
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm --prefix console ci --silent --no-fund --no-audit
      - run: npm --prefix console run build --silent
      - run: npm --prefix console run build:acceptance --silent
      - run: npm --prefix console exec -- playwright install --with-deps chromium
      - name: Build console acceptance backends
        run: |
          scripts/repo-cargo build -p meerkat-meta --example library_mode_reference --example console_acceptance_fixture --example memory_console_reference --example workgraph_console_reference
          target_dir="$(scripts/repo-cargo --print-env | sed -n 's/^CARGO_TARGET_DIR=//p')"
          echo "META_EXAMPLE_BIN_DIR=${target_dir}/debug/examples" >> "$GITHUB_ENV"
      - name: Native MCP Apps rendering and reload
        if: matrix.shard == 1
        timeout-minutes: 5
        run: npm --prefix console run e2e:mcp-apps --silent
        env:
          META_BROWSER_EVIDENCE: ${{ github.workspace }}/output/playwright/console-acceptance/mcp-apps
      # The model remains held for more than the native HTTP action timeout.
      # Three mounted Apps must keep polling through the same MCP connection.
      - name: Native MCP Apps polling during an active model turn
        if: matrix.shard == 1
        timeout-minutes: 5
        run: npm --prefix console run e2e:mcp-apps --silent
        env:
          META_MCP_APPS_LONG_POLL: "1"
          META_BROWSER_EVIDENCE: ${{ github.workspace }}/output/playwright/console-acceptance/mcp-apps
      - run: node console/browser-e2e.cjs --shard=${{ matrix.shard }}/2
      - name: Upload console browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-browser-${{ github.run_id }}-${{ matrix.shard }}
          path: output/playwright/console-acceptance/
          # Leg 1 always writes MCP Apps evidence; leg 2 writes only what
          # its scenarios capture.
          if-no-files-found: ${{ matrix.shard == 1 && 'error' || 'warn' }}

  # The composer typing check, split from `console`. It bundles its own
  # host with esbuild and needs no Rust.
  console-perf:
    name: console-perf
    needs: changes
    if: needs.changes.outputs.console_perf == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm --prefix console ci --silent --no-fund --no-audit
      - run: npm --prefix console exec -- playwright install --with-deps chromium
      # Real-browser composer typing with a full identity log and a
      # FlowForensics-shaped session, idle and while a reply streams. jsdom
      # has no style, layout or paint, so only a browser can see this
      # regress. Fails only on runner-independent work counts (layout objects
      # per keystroke, full derivations and turn renders per streamed token);
      # wall-clock p95 is printed as advisory (META_TYPING_LAG_ENFORCE_TIMING=1
      # makes it a failure for local perf work).
      - run: npm --prefix console run perf:typing:browser --silent

  # Needs Rust but NOT playwright: the script bundles with esbuild, runs
  # `node --test`, then `cargo test -p meerkat-meta --test
  # console_customization_fixtures`, which is where its 12 minutes go.
  console-fixtures:
    name: console-fixtures
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: meta-dev-examples
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm --prefix console ci --silent --no-fund --no-audit
      - run: npm --prefix console run fixtures:console-customization --silent

  # Needs playwright (it captures screenshots) and builds its OWN example -
  # incident_command_center plus mcp_fixture - so it does not depend on
  # library_mode_reference or on any step left in `console`.
  console-acceptance:
    name: console-acceptance
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: meta-dev-examples
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm --prefix console ci --silent --no-fund --no-audit
      - run: npm --prefix console exec -- playwright install --with-deps chromium
      - name: Stock incident topology acceptance
        run: examples/001-incident-command-center-pack/topology_examples.sh
      - name: Upload incident topology screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-topology-${{ github.run_id }}
          path: output/playwright/incident-topology-*.png
          if-no-files-found: warn
          retention-days: 7

  flow-editor:
    name: flow-editor
    needs: changes
    if: needs.changes.outputs.flow_editor == 'true'
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: flow-editor/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: meta-dev-bins
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # release.yml's verify_crate_packages restores this entry; no
          # executable from ~/.cargo/bin rides along.
          cache-bin: false
      - run: npm --prefix flow-editor ci --silent --no-fund --no-audit
      - run: npm --prefix flow-editor exec -- playwright install --with-deps chromium
      - run: CARGO_INCREMENTAL=0 scripts/repo-cargo build -p meerkat-meta --bin meta_flow_editor
      - run: npm --prefix flow-editor run test:controller --silent
      - run: npm --prefix flow-editor run test:visual-contract --silent
      - run: npm --prefix flow-editor run test:browser-source --silent
      - run: npm --prefix flow-editor run test:browser-interactions --silent

  # The TypeScript SDK suite ran nowhere. 705 tests across 20 files existed and
  # gated nothing, so a wrong RPC method name or a parser reading the wrong wire
  # keys reached npm with only a typecheck behind it - and a typecheck cannot see
  # either. `validate` is typecheck + build + test in that order because most of
  # these tests import the built `dist/`, not `src/`.
  test-typescript:
    name: test-typescript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm --prefix sdk/typescript ci --silent --no-fund --no-audit
      - run: npm --prefix sdk/typescript run validate --silent

  audit:
    name: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned to the last-green revision: the floating v2 tag moved to a
      # broken entrypoint on 2026-07-13 ("error: unrecognized subcommand
      # 'warn'" before any check runs). Re-float once upstream fixes v2.
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe

  # Pushes to main only, after every job that saves a rust cache has
  # succeeded and so has restored and saved its entry: drops each family's
  # main entries created before this run when a newer one exists, normally
  # this run's save (a concurrent main run's counts too). It cannot undo an
  # eviction the cache quota forced earlier.
  # This is the only job with actions: write. It never runs for a pull
  # request, so pull request code never holds that permission. Best
  # effort: a failure here must not turn the exact-main run red, which
  # release.yml requires to be green.
  drop-superseded-caches:
    name: drop-superseded-caches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fmt-lint, test, test-integration, test-extension-state, extension-state-lint, test-voice, voice-clippy, test-python, console, console-browser, console-fixtures, console-acceptance, flow-editor]
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Drop superseded rust caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-drop-superseded-caches.sh fmt-lint test test-extension-state extension-state-lint test-voice voice-clippy meta-dev-bins meta-dev-examples

  gate:
    name: gate
    if: always()
    needs: [changes, fmt-lint, test, test-integration, test-extension-state, extension-state-lint, test-voice, voice-clippy, test-python, test-typescript, console, console-browser, console-perf, console-fixtures, console-acceptance, flow-editor, audit]
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          LANE_RUST: ${{ needs.changes.outputs.rust }}
          LANE_INTEGRATION: ${{ needs.changes.outputs.integration }}
          LANE_PYTHON: ${{ needs.changes.outputs.python }}
          LANE_CONSOLE: ${{ needs.changes.outputs.console }}
          LANE_CONSOLE_PERF: ${{ needs.changes.outputs.console_perf }}
          LANE_FLOW_EDITOR: ${{ needs.changes.outputs.flow_editor }}
        run: |
          status=0
          # check <job> <result> <required|lane>: a job in a lane may be
          # skipped only when `changes` set that lane to exactly "false",
          # never when the classification is missing or failed.
          check() {
            local lane_value=""
            if [[ "$3" != "required" ]]; then
              local variable="LANE_${3^^}"
              lane_value="${!variable-}"
            fi
            if [[ "$2" == "success" ]]; then
              echo "  $1: success"
            elif [[ "$3" != "required" && "$2" == "skipped" && "${lane_value}" == "false" ]]; then
              echo "  $1: skipped (no change reaches the $3 lane)"
            else
              echo "  $1: $2"
              status=1
            fi
          }
          check changes "${{ needs.changes.result }}" required
          check fmt-lint "${{ needs.fmt-lint.result }}" required
          check test "${{ needs.test.result }}" rust
          check test-integration "${{ needs.test-integration.result }}" integration
          check test-extension-state "${{ needs.test-extension-state.result }}" rust
          check extension-state-lint "${{ needs.extension-state-lint.result }}" rust
          check test-voice "${{ needs.test-voice.result }}" rust
          check voice-clippy "${{ needs.voice-clippy.result }}" rust
          check test-python "${{ needs.test-python.result }}" python
          check test-typescript "${{ needs.test-typescript.result }}" required
          check console "${{ needs.console.result }}" console
          check console-browser "${{ needs.console-browser.result }}" console
          check console-perf "${{ needs.console-perf.result }}" console_perf
          check console-fixtures "${{ needs.console-fixtures.result }}" console
          check console-acceptance "${{ needs.console-acceptance.result }}" console
          check flow-editor "${{ needs.flow-editor.result }}" flow_editor
          check audit "${{ needs.audit.result }}" required
          if [[ "${status}" != 0 ]]; then
            echo "One or more jobs failed, were cancelled, or were skipped without a classification that excludes their lane."
            exit 1
          fi
