name: Release
# MobKit release protocol v1: tags validate only. Publication requires an
# explicit accepted-artifact selection through `make release-promote`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_mode:
        description: "existing: validate/registry retry; candidate: build only; promote: accepted bytes; assets: add-only recovery"
        required: false
        default: existing
        type: choice
        options: [existing, candidate, promote, assets]
      source_sha:
        description: "Candidate only: exact merged-main release commit (must equal dispatch SHA)"
        required: false
        default: ""
        type: string
      artifact_selection:
        description: "Promotion/recovery only: explicit versioned immutable artifact selection JSON"
        required: false
        default: ""
        type: string
      publish_release_packages:
        description: "Publish Rust/Python/TypeScript artifacts to registries"
        required: false
        default: false
        type: boolean
      registry_dry_run:
        description: "Nonpublishing rehearsal: no GitHub, registry, or docs writes"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Explicit existing tag for promotion or registry/asset recovery"
        required: false
        default: ""
        type: string

permissions:
  # `actions: read` lets require_ci_green list ci.yml runs. A permissions block
  # sets every unlisted scope to none, so omitting it makes the gate fail closed
  # on an API 403 rather than on a real red - a refusal for the wrong reason.
  actions: read
  contents: read

concurrency:
  # Candidate runs are independent. Every dispatch that may write the same
  # release is serialized; tag events never write and need no release lock.
  group: mobkit-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Required GitHub Actions secrets for full release:
#   CARGO_REGISTRY_TOKEN  - crates.io API token
#   PYPI_API_TOKEN        - PyPI API token (scoped to meerkat-mobkit package)
#   NPM_TOKEN             - npm access token (scoped to @rkat org)
#   DOCS_PUBLISH_TOKEN    - fine-grained token with Contents: write on lukacf/meerkat;
#                           used only to dispatch the docs-owner workflow

jobs:
  resolve_release:
    name: Resolve protocol and immutable source
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish_packages: ${{ steps.resolve.outputs.publish_packages }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      ci_bypass: ${{ steps.resolve.outputs.ci_bypass }}
    steps:
      - name: Checkout immutable workflow tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0

      - name: Resolve release mode and source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_SELECTION: ${{ inputs.artifact_selection }}
          PUBLISH_RELEASE_PACKAGES: ${{ inputs.publish_release_packages }}
          REGISTRY_DRY_RUN: ${{ inputs.registry_dry_run }}
        run: python3 scripts/release-candidate.py resolve

  # MobKit's release path had no CI gate at all: release_validate had no `needs`,
  # so a tag on any commit published without anyone checking that commit was ever
  # green. Tonight (v0.8.26) the check was done by hand. This refuses instead.
  #
  # It REFUSES rather than WAITS. The release goal is tag-to-registries from an
  # already-merged-green exact-main, so a poll would only ever burn the budget on
  # a precondition that should already hold. Waiting would also convert "this
  # commit was never verified" into "this is taking a while", which is the wrong
  # thing to be patient about.
  require_ci_green:
    name: Require green exact-main CI
    needs: [resolve_release]
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.ci_run.outputs.run_id }}
      run_attempt: ${{ steps.ci_run.outputs.run_attempt }}
    steps:
      - name: Refuse unless exact-main CI is already green for this commit
        id: ci_run
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ needs.resolve_release.outputs.sha }}
          CI_BYPASS: ${{ needs.resolve_release.outputs.ci_bypass }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = process.env.RELEASE_SHA;

            // Only the resolver's explicit existing/no-tag/package-dry-run
            // lane can bypass CI. Candidate and promotion never qualify.
            if (process.env.CI_BYPASS === "true") {
              core.info(
                "Dry-run dispatch with no release_tag: nothing is published, " +
                  "so there is no publication to gate. Skipping the CI check."
              );
              return;
            }

            // No pagination: the head_sha filter bounds this to attempts on a
            // single commit, which is 1-3 runs. If that ever stops being true,
            // page it rather than trusting a truncated first page.
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "ci.yml",
              branch: "main",
              event: "push",
              head_sha: ref,
              per_page: 100,
            });

            // Re-filter client-side. The API treats these as hints, and a run
            // from another branch or event answers a different question than
            // "was this exact commit green on main".
            const runs = data.workflow_runs.filter(
              (run) =>
                run.head_sha === ref &&
                run.head_branch === "main" &&
                run.event === "push"
            );

            if (runs.length === 0) {
              core.setFailed(
                `No exact-main CI run exists for release commit ${ref}.\n` +
                  `A tag is not evidence. Push this commit to main, let ci.yml ` +
                  `run to a green terminal state, then re-run this release.`
              );
              return;
            }

            core.info(
              runs
                .map((run) => `CI attempt ${run.run_attempt}: ${run.status}/${run.conclusion || "pending"} (${run.html_url})`)
                .join("\n")
            );

            const success = runs.find(
              (run) => run.status === "completed" && run.conclusion === "success"
            );
            if (!success) {
              core.setFailed(
                `Release commit ${ref} has ${runs.length} exact-main CI run(s), ` +
                  `none completed successfully. Fix the red or wait for the ` +
                  `in-flight run to finish, then re-run this release. Do not ` +
                  `re-run CI to obtain a second opinion on the same tree.`
              );
              return;
            }

            core.info(`Release commit ${ref} has green exact-main CI: ${success.html_url}`);
            core.setOutput("run_id", String(success.id));
            core.setOutput("run_attempt", String(success.run_attempt));

  release_validate:
    name: Validate release state
    needs: [resolve_release, require_ci_green]
    if: >-
      needs.resolve_release.outputs.mode != 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install console dependencies
        run: npm --prefix console ci --silent --no-fund --no-audit

      - name: Verify embedded console bundle freshness
        run: npm --prefix console run embedded:freshness --silent

      - name: Verify version parity
        run: make verify-version-parity

      - name: Check formatting
        run: make fmt-check

  build_binaries:
    name: Build gateway binaries (${{ matrix.target }})
    needs: [resolve_release, release_validate]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.resolve_release.outputs.mode == 'candidate'
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Migrated off the self-hosted BuildBuddy/GCP infra to GitHub-hosted runners
    # (mirrors meerkat's release build): each target builds natively on its own
    # runner with plain cargo — no bazel, no BuildBuddy, no self-hosted runner.
    runs-on: ${{ matrix.runs-on }}
    # A Linux GNU binary's glibc floor is whatever glibc it was linked
    # against. Built directly on ubuntu-latest (Ubuntu 24.04, glibc 2.39),
    # the v0.8.30 gateways carried a hard GLIBC_2.39 version requirement
    # (pidfd_spawnp/pidfd_getpid) and refused to load on Debian bookworm
    # (2.36), Ubuntu 22.04 (2.35) and bullseye (2.31), and nothing read the
    # produced binary to notice. Building inside buildpack-deps:bullseye pins
    # the floor at 2.31, the same image and floor meerkat's release lane
    # ships, and scripts/check-linux-release-binary-portability.sh refuses
    # any binary above it before packaging. Non-Linux matrix entries get no
    # container.
    container: ${{ contains(matrix.target, 'unknown-linux-gnu') && 'docker.io/library/buildpack-deps:bullseye' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          - runs-on: macos-15
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - runs-on: macos-15-large
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          # The Linux key names the container. rust-cache keys on rustc, the
          # lock and the environment, none of which changed when the Linux
          # legs moved into bullseye, so the target directory the host builds
          # left behind (C objects compiled against glibc 2.39 headers) would
          # otherwise be restored into the container, the portability gate
          # would refuse the result, and every retry would restore the same
          # stale cache because rust-cache saves only on success. macOS and
          # Windows keys are unchanged.
          key: release-${{ contains(matrix.target, 'unknown-linux-gnu') && 'bullseye-' || '' }}${{ matrix.target }}

      # Meerkat 0.8.40's `openai-live` path pulls `opus` -> `audiopus_sys`,
      # whose build script falls back to compiling bundled Opus with CMake when
      # no system libopus is found (true on every runner here). The Bullseye
      # container ships no cmake at all, and installing it from Bullseye apt
      # failed twice on 2026-09-18 when bullseye-security's pool dropped a
      # dependency the CDN-cached index still listed (404 on both arches), so
      # the container gets a pinned Kitware CMake 3.x tarball verified by
      # sha256 instead. CMake 4 rejects bundled Opus's 3.1 minimum, hence 3.x.
      # actions/checkout marks the workspace safe for the host user, and the
      # container user differs, so plain cargo's first git query otherwise
      # fails with "detected dubious ownership".
      - name: Prepare Linux release container
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          cmake_version_pin="3.31.12"
          case "$(uname -m)" in
            x86_64)
              cmake_arch="linux-x86_64"
              cmake_sha256="0dc2e9a6860f06bf10bd8fadc03e35d9eeb4df46e33763a7e480e987758f385c"
              ;;
            aarch64)
              cmake_arch="linux-aarch64"
              cmake_sha256="83f8fd91d2038a56556e1400390fcfe42f79602940c494f6c6f1cdae7f9e7f40"
              ;;
            *)
              echo "Linux release container has no pinned CMake for $(uname -m)" >&2
              exit 1
              ;;
          esac
          cmake_tarball="cmake-${cmake_version_pin}-${cmake_arch}.tar.gz"
          curl --fail --location --retry 5 --retry-delay 5 --silent --show-error \
            --output "/tmp/${cmake_tarball}" \
            "https://github.com/Kitware/CMake/releases/download/v${cmake_version_pin}/${cmake_tarball}"
          echo "${cmake_sha256}  /tmp/${cmake_tarball}" | sha256sum --check --strict
          mkdir -p /opt/cmake
          tar --extract --gzip --file "/tmp/${cmake_tarball}" --directory /opt/cmake --strip-components=1
          echo "/opt/cmake/bin" >> "${GITHUB_PATH}"
          cmake_version="$(/opt/cmake/bin/cmake --version | awk 'NR == 1 { print $3 }')"
          case "${cmake_version}" in
            3.*) ;;
            *)
              echo "Linux release container requires CMake 3.x, found ${cmake_version}" >&2
              exit 1
              ;;
          esac
          echo "Linux release container CMake: ${cmake_version} (${cmake_arch})"

      - name: Apply release build profile overrides
        shell: bash
        # These established build-profile overrides are part of candidate
        # production, before attestation/acceptance; promotion never rebuilds.
        run: |
          set -euo pipefail
          for crate in meerkat-core meerkat-runtime meerkat-mob meerkat-live; do
            if ! grep -q "profile.release.package.${crate}]" Cargo.toml; then
              printf '\n[profile.release.package.%s]\nopt-level = 0\n' "$crate" >> Cargo.toml
              echo "injected opt-0 profile for ${crate}"
            fi
          done

      - name: Build gateway binaries
        shell: bash
        env:
          CARGO_TARGET_DIR: target
          # Bound rustc parallelism: the meerkat mega-crates (meerkat-mob,
          # meerkat-runtime, meerkat-mobkit lib) each drive LLVM into multiple
          # GB; at default -j on 16 GB hosted runners the Windows leg dies
          # with "rustc-LLVM ERROR: out of memory" and the Linux legs get
          # OOM-killed (surfacing as "runner received a shutdown signal",
          # exit 143) — v0.7.22's first matrix run lost 3/5 legs to this.
          CARGO_BUILD_JOBS: "2"
          # The bundled Opus that audiopus_sys compiles declares
          # cmake_minimum_required(VERSION 3.1). The macOS and Windows runners
          # carry CMake 4, which refuses anything below 3.5 unless this floor
          # is supplied; cmake >= 3.31 reads it from the environment and the
          # cmake crate passes the environment through. Harmless on the 3.x
          # Linux lane.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -euo pipefail
          # Build BOTH gateways for this target with plain cargo. (The repo-cargo
          # wrapper redirects CARGO_TARGET_DIR for dev-worktree isolation; a clean
          # release runner wants the predictable ./target path.) rpc_gateway is the
          # SDK stdin-RPC gateway; mobkit_gateway is the console/HTTP one — SDK
          # users need rpc_gateway, so both ship.
          # --locked: the binaries we ship must be built from the SAME
          # dependency set the audit lane checked. Without it cargo is
          # permitted to resolve differently from the committed lock, so a
          # green `cargo deny` would be a measurement of the source while the
          # published artifact carried something else. RUSTSEC-2026-0258 made
          # that distinction concrete: adopters running a prebuilt gateway are
          # exposed by what is IN THE BINARY, not by what the lock says.
          cargo build -p meerkat-mobkit --bin mobkit_gateway --bin rpc_gateway --bin mobkit_repair \
            --features openai-live --locked --release --target "${{ matrix.target }}"

      # The gate reads the produced binary, not the build environment: a
      # container or toolchain change that raised the floor would otherwise
      # publish silently, which is exactly how the ubuntu-latest builds shipped
      # through v0.8.30. Every binary the build step produces is checked, and
      # the step fails closed before anything is packaged, attested or
      # uploaded. scripts/test_release_workflow.py runs this body against the
      # build step's --bin list, so a binary added there without a line here
      # fails CI rather than shipping unchecked.
      - name: Check Linux binary portability
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ./scripts/check-linux-release-binary-portability.sh \
            "target/${TARGET}/release/mobkit_gateway" \
            "target/${TARGET}/release/rpc_gateway" \
            "target/${TARGET}/release/mobkit_repair"

      - name: Ad-hoc codesign macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for bin in mobkit_gateway rpc_gateway mobkit_repair; do
            codesign --force --sign - "target/${{ matrix.target }}/release/${bin}"
          done

      - name: Package artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.resolve_release.outputs.version }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # cargo bin name -> published archive prefix
          BINS=("mobkit_gateway:mobkit-gateway" "rpc_gateway:mobkit-rpc-gateway" "mobkit_repair:mobkit-repair")
          for entry in "${BINS[@]}"; do
            bin="${entry%%:*}"; prefix="${entry##*:}"
            if [[ "${RUNNER_OS}" == "Windows" ]]; then
              src="target/${TARGET}/release/${bin}.exe"
            else
              src="target/${TARGET}/release/${bin}"
            fi
            if [[ ! -f "$src" ]]; then
              echo "::error::missing expected binary at $src" >&2
              exit 1
            fi
            artifact="${prefix}-${VERSION}-${TARGET}.${ARCHIVE_EXT}"
            if [[ "$ARCHIVE_EXT" == "zip" ]]; then
              7z a -tzip "dist/${artifact}" "$(cygpath -w "$src")" >/dev/null
            else
              tar -czf "dist/${artifact}" -C "$(dirname "$src")" "$(basename "$src")"
            fi
            if [[ ! -s "dist/${artifact}" ]]; then
              echo "::error::archive dist/${artifact} missing or empty" >&2
              exit 1
            fi
            echo "packaged dist/${artifact}"
          done

      # Binaries carry provenance naming the commit they were built from. The
      # release path consumes that digest: a tag whose object differs from an
      # artifact's sourceRepositoryDigest publishes bytes the tag does not name,
      # and every job still reads green. meerkat v0.8.30 shipped that way - its
      # Linux x86 archives were built from main two commits past the tag - and
      # the divergence was only visible because the attestation recorded it.
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Retain original provenance bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/provenance.jsonl

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobkit-gateway-binaries-${{ matrix.target }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  collect_candidate:
    name: Bind immutable candidate artifacts
    needs: [resolve_release, require_ci_green, build_binaries]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.resolve_release.outputs.mode == 'candidate'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ needs.resolve_release.outputs.mode }}
      RELEASE_SHA: ${{ needs.resolve_release.outputs.sha }}
      RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
      RELEASE_TAG: ${{ needs.resolve_release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
          fetch-depth: 0

      - name: Collect verified original artifacts
        env:
          CI_RUN_ID: ${{ needs.require_ci_green.outputs.run_id }}
          CI_RUN_ATTEMPT: ${{ needs.require_ci_green.outputs.run_attempt }}
        run: |
          python3 scripts/release-candidate.py collect --output-dir candidate \
            --ci-run-id "$CI_RUN_ID" --ci-run-attempt "$CI_RUN_ATTEMPT"

      - name: Attest candidate manifest
        id: provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: candidate/candidate-manifest.json

      - name: Retain manifest provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" candidate/provenance.jsonl

      - name: Upload immutable candidate manifest
        id: manifest
        uses: actions/upload-artifact@v4
        with:
          name: mobkit-candidate-manifest-${{ github.run_attempt }}
          path: candidate/*
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Emit explicit acceptance selection
        env:
          ARTIFACT_ID: ${{ steps.manifest.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.manifest.outputs.artifact-digest }}
        run: |
          python3 scripts/release-candidate.py selection \
            --manifest-file candidate/candidate-manifest.json \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"

  verify_release_assets:
    name: Verify selected or published original bytes
    needs: [resolve_release, release_validate]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (needs.resolve_release.outputs.mode == 'promote' ||
       (needs.resolve_release.outputs.mode == 'existing' &&
        needs.resolve_release.outputs.publish_packages == 'true' &&
        needs.resolve_release.outputs.dry_run == 'false'))
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ needs.resolve_release.outputs.mode }}
      RELEASE_SHA: ${{ needs.resolve_release.outputs.sha }}
      RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
      RELEASE_TAG: ${{ needs.resolve_release.outputs.tag }}
      ARTIFACT_SELECTION: ${{ inputs.artifact_selection }}
      REGISTRY_DRY_RUN: ${{ needs.resolve_release.outputs.dry_run }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
          fetch-depth: 0
      - name: Checkout immutable workflow tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
      - name: Verify selected candidate
        if: needs.resolve_release.outputs.mode == 'promote'
        run: python3 .release-tools/scripts/release-candidate.py stage --output-dir release-assets --proof-dir release-proofs
      - name: Verify existing published assets without writes
        if: needs.resolve_release.outputs.mode == 'existing'
        run: python3 .release-tools/scripts/release-candidate.py verify-published

  publish_github_release:
    name: Add original release assets without replacement
    needs: [resolve_release, release_validate, verify_release_assets]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.release_validate.result == 'success' &&
      needs.resolve_release.outputs.dry_run == 'false' &&
      ((needs.resolve_release.outputs.mode == 'promote' &&
        needs.verify_release_assets.result == 'success') ||
       (needs.resolve_release.outputs.mode == 'assets' &&
        needs.resolve_release.outputs.publish_packages == 'false'))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ needs.resolve_release.outputs.mode }}
      RELEASE_SHA: ${{ needs.resolve_release.outputs.sha }}
      RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
      RELEASE_TAG: ${{ needs.resolve_release.outputs.tag }}
      ARTIFACT_SELECTION: ${{ inputs.artifact_selection }}
      REGISTRY_DRY_RUN: ${{ needs.resolve_release.outputs.dry_run }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
          fetch-depth: 0
      - name: Checkout immutable workflow tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
      - name: Reverify original candidate before publication
        if: needs.resolve_release.outputs.mode == 'promote'
        run: python3 .release-tools/scripts/release-candidate.py stage --output-dir release-assets --proof-dir release-proofs
      - name: Publish exact original archives
        if: needs.resolve_release.outputs.mode == 'promote'
        run: python3 .release-tools/scripts/release-candidate.py publish --assets-dir release-assets --proof-dir release-proofs
      - name: Recover explicitly selected missing original assets
        if: needs.resolve_release.outputs.mode == 'assets'
        run: python3 .release-tools/scripts/release-candidate.py recover

  publish_sdk_packages:
    name: Publish SDK packages
    # A real registry upload requires the already-public exact binary set.
    # Promotion verifies accepted bytes; registry-only retry reads existing
    # release assets without ever invoking their publisher.
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.release_validate.result == 'success' &&
      needs.resolve_release.outputs.publish_packages == 'true' &&
      ((needs.resolve_release.outputs.mode == 'existing' &&
        (needs.resolve_release.outputs.dry_run == 'true' ||
         needs.verify_release_assets.result == 'success')) ||
       (needs.resolve_release.outputs.mode == 'promote' &&
        needs.verify_release_assets.result == 'success' &&
        (needs.resolve_release.outputs.dry_run == 'true' ||
         needs.publish_github_release.result == 'success')))
    needs: [resolve_release, release_validate, verify_release_assets, publish_github_release]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}

      - name: Install Python + Node tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish Python SDK
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        working-directory: sdk/python
        run: |
          set -euo pipefail
          DRY_RUN="${{ needs.resolve_release.outputs.dry_run }}"
          python -m pip install --upgrade build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Python SDK dry-run: skipping upload"
          else
            python -m twine upload --skip-existing dist/*
          fi

      - name: Publish TypeScript SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          DRY_RUN="${{ needs.resolve_release.outputs.dry_run }}"
          npm install --ignore-scripts
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm run build
          if [[ "$DRY_RUN" == "true" ]]; then
            npm publish --access public --dry-run
          else
            PACKAGE_NAME=$(node -p "require('./package.json').name")
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            PACKAGE_SPEC="${PACKAGE_NAME}@${PACKAGE_VERSION}"
            VIEW_STDERR=$(mktemp)
            trap 'rm -f "$VIEW_STDERR"' EXIT

            if PUBLISHED_VERSION=$(npm view "$PACKAGE_SPEC" version --registry=https://registry.npmjs.org/ 2>"$VIEW_STDERR"); then
              if [[ "$PUBLISHED_VERSION" != "$PACKAGE_VERSION" ]]; then
                echo "::error::npm returned unexpected version '$PUBLISHED_VERSION' for exact package spec '$PACKAGE_SPEC'." >&2
                exit 1
              fi
              echo "  $PACKAGE_SPEC: already published, skipping"
            else
              VIEW_STATUS=$?
              if grep -Eq '(^|[[:space:]])E404([[:space:]]|$)' "$VIEW_STDERR"; then
                echo "Publishing $PACKAGE_SPEC to npm"
                npm publish --access public
              else
                cat "$VIEW_STDERR" >&2
                exit "$VIEW_STATUS"
              fi
            fi
          fi


  publish_registries:
    name: Publish crate + SDK packages
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.release_validate.result == 'success' &&
      needs.resolve_release.outputs.publish_packages == 'true' &&
      ((needs.resolve_release.outputs.mode == 'existing' &&
        (needs.resolve_release.outputs.dry_run == 'true' ||
         needs.verify_release_assets.result == 'success')) ||
       (needs.resolve_release.outputs.mode == 'promote' &&
        needs.verify_release_assets.result == 'success' &&
        (needs.resolve_release.outputs.dry_run == 'true' ||
         needs.publish_github_release.result == 'success'))) &&
      needs.publish_sdk_packages.result == 'success'
    needs: [resolve_release, release_validate, verify_release_assets, publish_github_release, publish_sdk_packages]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install Python tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish extension document crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          DRY_RUN="${{ needs.resolve_release.outputs.dry_run }}"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Running cargo publish in dry-run mode"
            scripts/repo-cargo publish -p mobkit-extension-state --locked --dry-run
          else
            echo "Publishing mobkit-extension-state to crates.io"
            output=$(scripts/repo-cargo publish -p mobkit-extension-state --locked 2>&1) && true
            rc=$?
            if [[ $rc -eq 0 ]]; then
              echo "  mobkit-extension-state: published"
            elif echo "$output" | grep -q "already exists\|already uploaded"; then
              echo "  mobkit-extension-state: already published, skipping"
            else
              echo "$output" >&2
              exit $rc
            fi
          fi

      - name: Publish Rust crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          DRY_RUN="${{ needs.resolve_release.outputs.dry_run }}"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Running cargo publish in dry-run mode"
            scripts/repo-cargo publish -p meerkat-mobkit --locked --dry-run
          else
            echo "Publishing meerkat-mobkit to crates.io"
            output=$(scripts/repo-cargo publish -p meerkat-mobkit --locked 2>&1) && true
            rc=$?
            if [[ $rc -eq 0 ]]; then
              echo "  meerkat-mobkit: published"
            elif echo "$output" | grep -q "already exists\|already uploaded"; then
              echo "  meerkat-mobkit: already published, skipping"
            else
              echo "$output" >&2
              exit $rc
            fi
          fi

      - name: Verify exact packages are public on every registry
        if: needs.resolve_release.outputs.dry_run == 'false'
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python scripts/verify-published-registries.py --version "$VERSION"
