name: Release prewarm
# Builds a release pull request's gateway binaries before it merges, so the
# candidate that follows the merge restores Meerkat Core and every other
# dependency from main's cache instead of compiling them. A Core bump makes
# every candidate leg compile Core in the release profile (run 38719226636:
# 38-68 minutes per leg, against 11-25 when the same legs restored their
# dependencies in run 38553017482), and the bump always arrives with the
# release pull request.
#
# Dispatch it on main once the release pull request is open:
#   make release-prewarm SOURCE_SHA=<the pull request head>
# A run on main writes main's cache, which is the only cache a candidate
# (dispatched on main) can read. The build_binaries job below repeats
# release.yml's build_binaries job id, matrix, container, toolchain, cache
# step, profile overrides and build command exactly, so rust-cache computes
# the same keys for the same Cargo.lock; scripts/test_release_workflow.py
# holds the two jobs equal. Nothing is signed, packaged, attested, uploaded
# or published, and no job holds more than read access.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Head commit (40 hex) of a release pull request branch in this repository"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # A newer dispatch supersedes an older one; a cancelled leg still saves
  # what it compiled (cache-on-failure).
  group: meta-release-prewarm
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve_source:
    name: Resolve prewarm source
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # Main's cache feeds every later candidate and pull request run, so
      # only a commit pushed to a branch of this repository may write it:
      # never a fork's pull request head, never a dispatch on another ref.
      - name: Require a branch head of this repository, dispatched on main
        id: resolve
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::dispatch the prewarm on main; only main's cache reaches a candidate" >&2
            exit 1
          fi
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-hex commit" >&2
            exit 1
          fi
          heads="$(git ls-remote --heads "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" | awk '{print $1}')"
          if ! grep -qx "${SOURCE_SHA}" <<< "${heads}"; then
            echo "::error::${SOURCE_SHA} is not the head of a branch of ${GITHUB_REPOSITORY}" >&2
            exit 1
          fi
          echo "sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"

  # The job id is part of rust-cache's key: it must stay build_binaries.
  # Its matrix, container and steps after Checkout are release.yml's
  # build_binaries with comments removed; the reasons live there.
  build_binaries:
    name: Prewarm gateway build (${{ matrix.target }})
    needs: [resolve_source]
    runs-on: ${{ matrix.runs-on }}
    container: ${{ contains(matrix.target, 'unknown-linux-gnu') && 'docker.io/library/buildpack-deps:bullseye' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          - runs-on: macos-15
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - runs-on: macos-15
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_source.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ contains(matrix.target, 'unknown-linux-gnu') && 'bullseye-' || '' }}${{ matrix.target }}
          cache-on-failure: true

      - name: Prepare Linux release container
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          cmake_version_pin="3.31.12"
          case "$(uname -m)" in
            x86_64)
              cmake_arch="linux-x86_64"
              cmake_sha256="0dc2e9a6860f06bf10bd8fadc03e35d9eeb4df46e33763a7e480e987758f385c"
              ;;
            aarch64)
              cmake_arch="linux-aarch64"
              cmake_sha256="83f8fd91d2038a56556e1400390fcfe42f79602940c494f6c6f1cdae7f9e7f40"
              ;;
            *)
              echo "Linux release container has no pinned CMake for $(uname -m)" >&2
              exit 1
              ;;
          esac
          cmake_tarball="cmake-${cmake_version_pin}-${cmake_arch}.tar.gz"
          curl --fail --location --retry 5 --retry-delay 5 --silent --show-error \
            --output "/tmp/${cmake_tarball}" \
            "https://github.com/Kitware/CMake/releases/download/v${cmake_version_pin}/${cmake_tarball}"
          echo "${cmake_sha256}  /tmp/${cmake_tarball}" | sha256sum --check --strict
          mkdir -p /opt/cmake
          tar --extract --gzip --file "/tmp/${cmake_tarball}" --directory /opt/cmake --strip-components=1
          echo "/opt/cmake/bin" >> "${GITHUB_PATH}"
          cmake_version="$(/opt/cmake/bin/cmake --version | awk 'NR == 1 { print $3 }')"
          case "${cmake_version}" in
            3.*) ;;
            *)
              echo "Linux release container requires CMake 3.x, found ${cmake_version}" >&2
              exit 1
              ;;
          esac
          echo "Linux release container CMake: ${cmake_version} (${cmake_arch})"

      - name: Apply release build profile overrides
        shell: bash
        run: |
          set -euo pipefail
          for crate in meerkat-core meerkat-runtime meerkat-mob meerkat-live; do
            if ! grep -q "profile.release.package.${crate}]" Cargo.toml; then
              printf '\n[profile.release.package.%s]\nopt-level = 0\n' "$crate" >> Cargo.toml
              echo "injected opt-0 profile for ${crate}"
            fi
          done

      - name: Build gateway binaries
        shell: bash
        env:
          CARGO_TARGET_DIR: target
          CARGO_BUILD_JOBS: "2"
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -euo pipefail
          cargo build -p meerkat-meta --bin meta_gateway --bin rpc_gateway --bin meta_repair \
            --features openai-live --locked --release --target "${{ matrix.target }}"
