[package]
name = "forge-service-host"
version = "0.3.1"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

# Native application composition. The executable is source-only until the
# existing owner lane qualifies this exact graph and protected installation.
[workspace]

[features]
linux-startup-controls = []

[[test]]
name = "startup_ownership"
path = "tests/startup_ownership.rs"
harness = false
required-features = ["linux-startup-controls"]

[dependencies]
forge-ghe-collections = { path = "../ghe-collections" }
forge-history-archive = { path = "../history-archive" }
# Connect from the Meerkat 0.9.10 release commit, with the feature set of its
# gateway build. Core and Meta come from the same commit (one source), so
# Connect, Meta and this application share each Core package.
meerkat-connect = { git = "https://github.com/lukacf/meerkat", rev = "3fb4cfbbc54c3f8b4d0bfd13cdb1dee7ef76eeef", features = ["console"] }
meerkat-core = { git = "https://github.com/lukacf/meerkat", rev = "3fb4cfbbc54c3f8b4d0bfd13cdb1dee7ef76eeef" }
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }

[lints.rust]
unsafe_code = "deny"

[target.'cfg(target_os = "linux")'.dependencies]
# Exact versions in the selected Meerkat 0.9.10 Cargo.lock.
libc = "=0.2.191"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "time", "io-util", "net", "process"] }

# The development profile of Connect's native-candidate workspace. Profiles
# come only from the workspace root, so this application repeats them.
[profile.dev]
debug = 1

[profile.dev.package."sha2:0.10.9"]
opt-level = 3
